<main class="flex min-h-screen items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <p class="text-2xl font-semibold text-brand-700">HRM</p>
      <h1 class="mt-2 text-xl font-semibold">Sign in to your account</h1>
    </div>

    <form class="card space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (error()) {
        <p class="rounded-md bg-danger/10 px-3 py-2 text-sm text-danger" role="alert">
          {{ error() }}
        </p>
      }

      <div>
        <label class="label" for="email">Email</label>
        <input
          id="email"
          class="input"
          type="email"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="invalid('email')"
          aria-describedby="email-error"
        />
        @if (invalid('email')) {
          <p id="email-error" class="field-error">Enter a valid email address.</p>
        }
      </div>

      <div>
        <label class="label" for="password">Password</label>
        <input
          id="password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="invalid('password')"
          aria-describedby="password-error"
        />
        @if (invalid('password')) {
          <p id="password-error" class="field-error">Enter your password.</p>
        }
      </div>

      <button class="btn-primary w-full" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    @if (showDemoAccounts) {
      <section class="mt-6 text-sm" aria-labelledby="demo-heading">
        <h2 id="demo-heading" class="text-muted">Demo accounts (development only)</h2>
        <div class="mt-2 grid grid-cols-2 gap-2">
          @for (account of demoAccounts; track account.email) {
            <button
              type="button"
              class="btn-secondary justify-start"
              (click)="useDemo(account.email)"
            >
              <span class="font-medium">{{ account.role }}</span>
              <span class="truncate text-muted">{{ account.email }}</span>
            </button>
          }
        </div>
      </section>
    }
  </div>
</main>
