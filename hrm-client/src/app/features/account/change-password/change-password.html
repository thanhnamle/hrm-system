<app-page-header
  title="Change password"
  description="You will be signed out of every device and sign in again with the new password."
/>

<form class="card max-w-md space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (formErrors().length) {
    <ul class="rounded-md bg-danger/10 px-3 py-2 text-sm text-danger" role="alert">
      @for (message of formErrors(); track message) {
        <li>{{ message }}</li>
      }
    </ul>
  }
  <app-form-field
    label="Current password"
    for="currentPassword"
    [control]="form.controls.currentPassword"
    required
  >
    <input
      id="currentPassword"
      class="input"
      type="password"
      formControlName="currentPassword"
      autocomplete="current-password"
      aria-describedby="currentPassword-error"
    />
  </app-form-field>
  <app-form-field
    label="New password"
    for="newPassword"
    [control]="form.controls.newPassword"
    required
    [hint]="hint"
  >
    <input
      id="newPassword"
      class="input"
      type="password"
      formControlName="newPassword"
      autocomplete="new-password"
      aria-describedby="newPassword-error"
    />
  </app-form-field>
  <app-form-field
    label="Repeat new password"
    for="repeatPassword"
    [control]="form.controls.repeatPassword"
    required
  >
    <input
      id="repeatPassword"
      class="input"
      type="password"
      formControlName="repeatPassword"
      autocomplete="new-password"
      aria-describedby="repeatPassword-error"
    />
  </app-form-field>
  <div class="flex justify-end">
    <button type="submit" class="btn-primary" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Change password' }}
    </button>
  </div>
</form>
