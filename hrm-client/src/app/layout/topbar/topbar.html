<header class="flex h-14 items-center justify-between border-b border-border bg-surface px-6">
  <span class="text-sm text-muted">HR Management System</span>

  @if (auth.user(); as user) {
    <div class="flex items-center gap-4">
      <div class="text-right leading-tight">
        <p class="text-sm font-medium">{{ user.fullName ?? user.email }}</p>
        <p class="text-xs text-muted">{{ user.role }}</p>
      </div>
      <a routerLink="/account/password" class="btn-ghost" routerLinkActive="text-ink">Password</a>
      <button type="button" class="btn-ghost" (click)="auth.logout()">Sign out</button>
    </div>
  }
</header>
