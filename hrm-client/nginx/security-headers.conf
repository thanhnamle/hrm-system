# Included in every location that sets its own add_header: Nginx only inherits add_header
# from the server block when a location sets none, so each such location includes this again.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Only our own scripts run. Angular adds component styles as <style> tags at runtime, hence
# 'unsafe-inline' for styles only. (The build has inlineCritical off, because that feature
# needs an inline script, which this policy blocks.)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Production behind TLS: also send HSTS (only ever over HTTPS, or browsers ignore it anyway):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
