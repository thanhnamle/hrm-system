# One origin for the browser: the Angular app at /, the API at /api.
# Same origin means no CORS, and the SameSite=Strict refresh cookie just works.

upstream hrm_api {
    # The compose service name; Docker's DNS resolves it inside the network.
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;            # no Nginx version in headers or error pages
    client_max_body_size 6m;      # CV upload limit is 5 MB; a little room for the multipart envelope

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # ---- API -------------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://hrm_api;          # no URI part: the path /api/... is passed unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Replace (not append) what the client sent, so it can't fake its IP for the rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # The API sets nosniff itself on file downloads; drop it so the header isn't sent twice.
        proxy_hide_header X-Content-Type-Options;
    }

    location = /health {
        proxy_pass http://hrm_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---- Angular app -----------------------------------------------------------------------
    # Bundles have a content hash in the name (main-7GYFG34D.js, outputHashing: all), so a
    # name never gets new content: cache for a year. Other files (favicon) use the defaults.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be fresh, or users keep an old app that points at deleted bundles.
    # Any unknown path (/employees/42) is a client-side route: serve the app and let Angular route.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
