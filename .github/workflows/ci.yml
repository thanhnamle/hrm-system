name: CI

# Every push to main and every pull request: build and test both apps, then build the Docker
# images and start the whole stack to prove that `docker compose up` really works.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hrm-server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('hrm-server/Directory.Packages.props', 'hrm-server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore hrm-server.slnx
      - run: dotnet build hrm-server.slnx -c Release --no-restore

      # Integration tests start PostgreSQL with Testcontainers; the runner has Docker.
      - name: Test
        run: dotnet test hrm-server.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: hrm-server/TestResults
          retention-days: 7

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hrm-client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hrm-client/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      # The github-actions reporter turns each failing test into an annotation (visible on the run
      # and in pull requests). The output is also kept for the summary step below.
      - name: Unit tests
        run: |
          set -o pipefail
          npx ng test --watch=false --reporters=default --reporters=github-actions 2>&1 | tee test-output.txt

      # Logs need a GitHub sign-in; the run summary doesn't. On failure, put the end of the test
      # output there (compile errors never become annotations).
      - name: Test output in the run summary
        if: failure()
        run: |
          {
            echo '### Frontend test output (last 80 lines)'
            echo '```'
            tail -n 80 test-output.txt | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npm run build

  docker:
    name: Docker (build + smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Throwaway secrets for this run only; the stack is deleted at the end.
      - name: Create .env
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_KEY=$(openssl rand -base64 48 | tr -d '\n')"
            echo "SEED_PASSWORD=Ci#$(openssl rand -hex 8)Aa1"
            echo "DB_PORT=5432"
            echo "WEB_PORT=8080"
          } > .env

      - name: Build images
        run: docker compose build

      # --wait returns once every healthcheck passes; web is healthy only when
      # Nginx -> API -> PostgreSQL all answer.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test through Nginx
        run: |
          set -uo pipefail
          failed=0
          # expect "<description>" <command...>: runs the command, prints PASS/FAIL, never stops early.
          expect() {
            local name=$1; shift
            if "$@" >/dev/null 2>&1; then echo "PASS $name"; else echo "FAIL $name"; failed=1; fi
          }
          has() { grep -qi "$1" <<<"$2"; }

          expect "/health is Healthy" has "Healthy" "$(curl -fsS http://localhost:8080/health)"

          headers=$(curl -fsS -D - -o /dev/null http://localhost:8080/)
          for h in Content-Security-Policy X-Frame-Options X-Content-Type-Options Referrer-Policy; do
            expect "header $h" has "^$h:" "$headers"
          done

          expect "deep link serves the app" has "<app-root>" "$(curl -fsS http://localhost:8080/employees/42)"

          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/employees)
          expect "API without a token is 401 (got $code)" test "$code" = 401

          password=$(grep SEED_PASSWORD .env | cut -d= -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@hrm.local\",\"password\":\"$password\"}" http://localhost:8080/api/auth/login)
          expect "admin signs in through Nginx (got $code)" test "$code" = 200

          exit $failed

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
